name: Lab 3 - DVC Pipeline Checks

# The real dataset lives in a private Cloud Storage bucket, so CI never sees it. Instead it checks:
#   1. unit tests pass,
#   2. dvc.lock matches the committed code and params, i.e. nobody changed the pipeline and
#      committed without running `dvc repro` (so the committed metrics belong to the committed code),
#   3. the whole pipeline runs end to end on Linux, using synthetic data with the real schema.

on:
  push:
    branches:
      - main
    paths:
      - 'Labs/Data_Labs/DVC_Labs/Lab_1/**'
      - '.github/workflows/lab3_dvc.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Labs/Data_Labs/DVC_Labs/Lab_1/**'
      - '.github/workflows/lab3_dvc.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Labs/Data_Labs/DVC_Labs/Lab_1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: pip install -r requirements.txt pytest

    - name: Unit tests
      run: pytest -v tests

    - name: Check dvc.lock matches committed code and params
      run: |
        dvc status || true   # shown for the log; data is expectedly missing
        python scripts/check_lock.py

    - name: Smoke-test the full pipeline on synthetic data
      run: |
        python scripts/make_synthetic_data.py --rows 500
        dvc repro --force
        dvc metrics show

    - name: Show the pipeline graph
      run: dvc dag
