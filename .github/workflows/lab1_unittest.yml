name: Lab 1 - Python Unittests

on:
  push:
    branches:
      - main
    paths:
      - 'Labs/Github_Labs/Lab1/**'
      - '.github/workflows/lab1_unittest.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Labs/Github_Labs/Lab1/**'
      - '.github/workflows/lab1_unittest.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Labs/Github_Labs/Lab1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run unittests
      run: python -m unittest test.test_unittest

    - name: Notify on success
      if: success()
      run: echo "Unit tests passed successfully"

    - name: Notify on failure
      if: failure()
      run: echo "Unit tests failed"
